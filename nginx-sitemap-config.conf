# ========================================
# CONFIGURACIÓN NGINX PARA SITEMAP.XML
# ========================================
#
# Archivo: /etc/nginx/sites-available/app.opynio.com
# (O donde tengas tu configuración de Nginx)
#
# Agrega esta configuración dentro del bloque `server` de app.opynio.com

# 1. Proxy para /sitemap.xml → Supabase Edge Function
location = /sitemap.xml {
    # Redirigir a la función de Supabase
    proxy_pass https://hvtrrhxeqrsnjxhngdsj.supabase.co/functions/v1/generate-sitemap;

    # Headers necesarios
    proxy_set_header Host hvtrrhxeqrsnjxhngdsj.supabase.co;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Cache de 24 horas
    proxy_cache_valid 200 24h;
    add_header Cache-Control "public, max-age=86400";
    add_header Content-Type "application/xml; charset=utf-8";

    # CORS headers (opcional, si necesitas CORS)
    add_header Access-Control-Allow-Origin "*";
    add_header Access-Control-Allow-Methods "GET, OPTIONS";
}

# 2. Proxy para /robots.txt (si quieres servirlo dinámicamente)
location = /robots.txt {
    root /var/www/app.opynio.com/html;  # Ajusta la ruta a tu directorio
    try_files /robots.txt =404;
    add_header Content-Type "text/plain; charset=utf-8";
    add_header Cache-Control "public, max-age=3600";
}

# ========================================
# INSTRUCCIONES DE INSTALACIÓN
# ========================================
#
# 1. Edita tu archivo de configuración de Nginx:
#    sudo nano /etc/nginx/sites-available/app.opynio.com
#
# 2. Agrega el bloque `location = /sitemap.xml` dentro del bloque `server`
#
# 3. Copia robots.txt al directorio web (si no está ya):
#    sudo cp robots.txt /var/www/app.opynio.com/html/robots.txt
#
# 4. Verifica la configuración de Nginx:
#    sudo nginx -t
#
# 5. Recarga Nginx:
#    sudo systemctl reload nginx
#
# 6. Prueba que funciona:
#    curl -I https://app.opynio.com/sitemap.xml
#
# Deberías ver:
# HTTP/2 200
# content-type: application/xml; charset=utf-8
# cache-control: public, max-age=86400
#
# ========================================
