<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejemplo de Widget Opynio</title>
    <style>
        body { font-family: system-ui, sans-serif; background-color: #f0f2f5; padding: 2rem; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        .container { max-width: 1200px; width: 100%; }
        h1 { color: #333; text-align: center; margin-bottom: 2rem; }
        p { text-align: center; color: #555; max-width: 600px; margin: 0 auto 2rem auto; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Ejemplo de Widget de Carrusel Horizontal</h1>
        <p>Este es un ejemplo de cómo se vería el widget en una página web externa. El código se carga desde un único archivo <strong>widget.js</strong>.</p>
        
        <!-- Opynio Widget Start -->
        <!-- Simplemente copia y pega este código en tu sitio web. -->
        <!-- Asegúrate de cambiar 'data-business-id' por el ID de tu empresa. -->
        <div class="opynio-widget" 
             data-business-id="b56d8d2a-c4e6-4ada-aa71-22e7348964bd" 
             data-widget-type="horizontal-carousel" 
             data-theme="light">
        </div>
        <script src="/widget.js" defer></script>
        <!-- Opynio Widget End -->

    </div>
</body>
</html>
